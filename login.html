<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guru</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f3f4f6; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 style="text-align: center;">Login Guru</h2>
        <input type="email" id="email" placeholder="Email Anda" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="btnLogin">Masuk</button>
        <p id="pesanError" style="color: red; font-size: 0.9em; text-align: center;"></p>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // MASUKKAN URL DAN KEY SUPABASE ANDA DI SINI
        const supabaseUrl = 'https://dtbomtpvdpwpbbmcjvnf.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0Ym9tdHB2ZHB3cGJibWNqdm5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2OTEwOTEsImV4cCI6MjA5ODI2NzA5MX0.V15MIuScZFKmQMPUIBRg7tHND-1HVOH_yg3ElBMHcts'
        const supabase = createClient(supabaseUrl, supabaseKey)

        const btnLogin = document.getElementById('btnLogin');
        const pesanError = document.getElementById('pesanError');

        btnLogin.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            btnLogin.innerText = 'Memeriksa...';
            pesanError.innerText = '';

            // Proses autentikasi ke Supabase
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                pesanError.innerText = 'Login gagal: ' + error.message;
                btnLogin.innerText = 'Masuk';
            } else {
                alert('Login Berhasil! Anda akan diarahkan ke Dashboard.');
                // Nanti kita arahkan ke halaman dashboard
                window.location.href = 'dashboard.html';
                btnLogin.innerText = 'Sukses';
            }
        });
    </script>
</body>
</html>
